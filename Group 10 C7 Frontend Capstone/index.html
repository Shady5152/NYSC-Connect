<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Access</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="wrapper">
    <div class="card">

      <!-- Tab switcher -->
      <div class="tabs" role="tablist">
        <button class="tab active" id="tab-login" role="tab" aria-selected="true">Log in</button>
        <button class="tab" id="tab-signup" role="tab" aria-selected="false">Sign up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="form active" novalidate>
        <h1 class="form-title">Welcome back</h1>
        <p class="form-subtitle">Log in to pick up where you left off.</p>

        <div class="field">
          <label for="login-email">Email</label>
          <input type="text" id="login-email" name="email" autocomplete="email" placeholder="group10@gmail.com" />
          <span class="error-msg" id="login-email-error"></span>
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="Enter your password" />
            <button type="button" class="toggle-visibility" data-target="login-password" aria-label="Show password">Show</button>
          </div>
          <span class="error-msg" id="login-password-error"></span>
        </div>

        <div class="login-options">
          <label class="checkbox-wrap">
            <input type="checkbox" id="remember-me" name="remember" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link" id="forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn">Log in</button>
        <p class="form-status" id="login-status"></p>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signup-form" class="form" novalidate>
        <h1 class="form-title">Create your account</h1>
        <p class="form-subtitle">Takes less than a minute.</p>

        <div class="field">
          <label for="signup-name">Full name</label>
          <input type="text" id="signup-name" name="name" autocomplete="name" placeholder="John Stone" />
          <span class="error-msg" id="signup-name-error"></span>
        </div>

        <div class="field">
          <label for="signup-email">Email</label>
          <input type="text" id="signup-email" name="email" autocomplete="email" placeholder="group10@gmail.com" />
          <span class="error-msg" id="signup-email-error"></span>
        </div>

        <div class="field">
          <label for="signup-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="signup-password" name="password" autocomplete="new-password" placeholder="Create a password" />
            <button type="button" class="toggle-visibility" data-target="signup-password" aria-label="Show password">Show</button>
          </div>

          <div class="strength-meter" id="strength-meter" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <p class="strength-label" id="strength-label"></p>

          <ul class="requirements" id="requirements">
            <li data-rule="length">At least 8 characters</li>
            <li data-rule="upper">One uppercase letter</li>
            <li data-rule="lower">One lowercase letter</li>
            <li data-rule="number">One number</li>
            <li data-rule="special">One special character</li>
          </ul>

          <span class="error-msg" id="signup-password-error"></span>
        </div>

        <div class="field">
          <label for="signup-confirm">Confirm password</label>
          <div class="password-wrap">
            <input type="password" id="signup-confirm" name="confirm" autocomplete="new-password" placeholder="Re-enter your password" />
            <button type="button" class="toggle-visibility" data-target="signup-confirm" aria-label="Show password">Show</button>
          </div>
          <span class="error-msg" id="signup-confirm-error"></span>
        </div>

        <button type="submit" class="submit-btn">Create account</button>
        <p class="form-status" id="signup-status"></p>
      </form>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
